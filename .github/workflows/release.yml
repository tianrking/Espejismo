name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  artifacts:
    name: artifact (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin espejismo-local --bin espejismo-remote
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pkg="espejismo-${{ matrix.name }}"
          mkdir -p "dist/${pkg}/bin" "dist/${pkg}/configs" "dist/${pkg}/docs"
          cp "target/${{ matrix.target }}/release/espejismo-local" "dist/${pkg}/bin/"
          cp "target/${{ matrix.target }}/release/espejismo-remote" "dist/${pkg}/bin/"
          cp configs/examples/espejismo.toml "dist/${pkg}/configs/"
          cp README.md "dist/${pkg}/"
          cp docs/ARCHITECTURE.md docs/deployment/LOGGING.md docs/deployment/PACKAGING.md docs/development/STATUS.md docs/testing/TEST_PLAN.md "dist/${pkg}/docs/"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "espejismo-${{ matrix.name }}"
          New-Item -ItemType Directory -Force "dist/$pkg/bin", "dist/$pkg/configs", "dist/$pkg/docs" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/espejismo-local.exe" "dist/$pkg/bin/"
          Copy-Item "target/${{ matrix.target }}/release/espejismo-remote.exe" "dist/$pkg/bin/"
          Copy-Item "configs/examples/espejismo.toml" "dist/$pkg/configs/"
          Copy-Item "README.md" "dist/$pkg/"
          Copy-Item "docs/ARCHITECTURE.md", "docs/deployment/LOGGING.md", "docs/deployment/PACKAGING.md", "docs/development/STATUS.md", "docs/testing/TEST_PLAN.md" "dist/$pkg/docs/"
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip" -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: espejismo-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  github-release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
