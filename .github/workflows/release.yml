name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  artifacts:
    name: artifact (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            use_cross: false
          - name: linux-386
            os: ubuntu-latest
            target: i686-unknown-linux-gnu
            archive: tar.gz
            use_cross: true
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            use_cross: true
          - name: linux-armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            archive: tar.gz
            use_cross: true
          - name: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            use_cross: false
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            use_cross: false
          - name: windows-386
            os: windows-latest
            target: i686-pc-windows-msvc
            archive: zip
            use_cross: false
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            use_cross: false

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --locked
      - name: Build
        if: matrix.use_cross != true
        run: cargo build --release --locked --target ${{ matrix.target }} --bin espejismo-local --bin espejismo-remote
      - name: Build with cross
        if: matrix.use_cross == true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "cross build attempt ${attempt}/5 for ${{ matrix.target }}"
            if cross build --release --locked --target ${{ matrix.target }} --bin espejismo-local --bin espejismo-remote; then
              exit 0
            fi
            status=$?
            if [[ "${attempt}" == "5" ]]; then
              exit "${status}"
            fi
            echo "::warning::cross build failed for ${{ matrix.target }} with status ${status}; retrying after backoff"
            docker image prune -f || true
            sleep $((attempt * 20))
          done
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pkg="espejismo-${{ matrix.name }}"
          mkdir -p "dist/${pkg}/bin" "dist/${pkg}/configs" "dist/${pkg}/docs" "dist/${pkg}/scripts"
          cp "target/${{ matrix.target }}/release/espejismo-local" "dist/${pkg}/bin/"
          cp "target/${{ matrix.target }}/release/espejismo-remote" "dist/${pkg}/bin/"
          cp configs/examples/espejismo.toml "dist/${pkg}/configs/"
          cp README.md "dist/${pkg}/"
          cp README_ES.md "dist/${pkg}/"
          cp CHANGELOG.md "dist/${pkg}/"
          cp docs/ARCHITECTURE.md docs/deployment/ADMIN.md docs/deployment/CLI.md docs/deployment/EGRESS.md docs/deployment/LOGGING.md docs/deployment/PACKAGING.md docs/deployment/PROFILES.md docs/deployment/QUICKSTART.md docs/deployment/TUN.md docs/deployment/UPDATES.md docs/deployment/USERS.md docs/development/STATUS.md docs/testing/TEST_PLAN.md "dist/${pkg}/docs/"
          cp scripts/setup-windows.ps1 scripts/e2e_smoke.ps1 scripts/stress_smoke.ps1 scripts/install-ubuntu-remote.sh "dist/${pkg}/scripts/"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "espejismo-${{ matrix.name }}"
          New-Item -ItemType Directory -Force "dist/$pkg/bin", "dist/$pkg/configs", "dist/$pkg/docs", "dist/$pkg/scripts" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/espejismo-local.exe" "dist/$pkg/bin/"
          Copy-Item "target/${{ matrix.target }}/release/espejismo-remote.exe" "dist/$pkg/bin/"
          Copy-Item "configs/examples/espejismo.toml" "dist/$pkg/configs/"
          Copy-Item "README.md" "dist/$pkg/"
          Copy-Item "README_ES.md" "dist/$pkg/"
          Copy-Item "CHANGELOG.md" "dist/$pkg/"
          Copy-Item "docs/ARCHITECTURE.md", "docs/deployment/ADMIN.md", "docs/deployment/CLI.md", "docs/deployment/EGRESS.md", "docs/deployment/LOGGING.md", "docs/deployment/PACKAGING.md", "docs/deployment/PROFILES.md", "docs/deployment/QUICKSTART.md", "docs/deployment/TUN.md", "docs/deployment/UPDATES.md", "docs/deployment/USERS.md", "docs/development/STATUS.md", "docs/testing/TEST_PLAN.md" "dist/$pkg/docs/"
          Copy-Item "scripts/setup-windows.ps1", "scripts/e2e_smoke.ps1", "scripts/stress_smoke.ps1", "scripts/install-ubuntu-remote.sh" "dist/$pkg/scripts/"
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip" -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: espejismo-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  checksums:
    name: checksums
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: espejismo-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  github-release:
    name: draft GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - artifacts
      - checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          draft: true
