[shared]
psk = "change-me-long-random-secret"
clock_skew_secs = 30
puzzle_bits = 12
max_padding = 64
jitter_ms = 0
padding_chance_percent = 35
backpressure_threshold_ms = 40
backpressure_cooldown_ms = 1000
# Duplex buffer between the mux and the encrypted frame pump. Keep this at
# least as large as the mux window (shared.mux.native_initial_window_bytes)
# so the pump never starves the mux under bulk transfer.
tunnel_buffer = 2097152
idle_timeout_secs = 300
max_streams = 256
max_physical_connections = 1024
key_update_frames = 16384

[shared.handshake_window]
# Dynamic handshake authentication keys. The client derives the first-packet
# handshake key from PSK + floor(unix_time / step_secs). The server accepts the
# current window plus previous_windows/future_windows to tolerate clock skew.
enabled = true
step_secs = 30
previous_windows = 1
future_windows = 0

[shared.tcp]
nodelay = true
keepalive_secs = 30
heartbeat_secs = 30
user_timeout_ms = 30000
# Size sockets to the bandwidth-delay product so one lane can fill a high-RTT
# link. ~2 MiB sustains ~80 Mbit/s at 200 ms RTT; raise for faster links.
send_buffer_bytes = 2097152
recv_buffer_bytes = 2097152
# BBR recovers throughput far better than CUBIC on lossy/long-haul paths.
# Linux and FreeBSD only (ignored elsewhere); needs the bbr kernel module.
congestion_control = "bbr"

[shared.mux]
mode = "yamux"
# Per-stream flow-control window. Per-stream throughput is roughly
# window / RTT, so high-RTT links need a large window. Now honored by BOTH
# yamux and native modes. ~2 MiB ~= 80 Mbit/s at 200 ms RTT.
native_initial_window_bytes = 2097152
native_stream_buffer_frames = 128
native_send_queue_frames = 64
native_idle_timeout_secs = 300
native_drain_timeout_secs = 30

[shared.pacing]
enabled = true
max_bytes_per_sec = 0
burst_bytes = 65536
min_write_bytes = 1024

[shared.obfuscation]
profile = "balanced"
chunk_policy = "balanced"
randomize_chunks = true
min_chunk = 4096
max_chunk = 16384

[shared.stealth]
frame_size = 4096
frame_size_candidates = [3328, 3584, 4096, 4608]
tick_ms = 50

[local]
server = "127.0.0.1:6690"
socks5_listen = "127.0.0.1:6680"
http_listen = "127.0.0.1:6681"
handshake_padding = 256

# Optional. Keep disabled for localhost-only browser use.
# [local.auth]
# username = "local-user"
# password = "local-pass"

[local.tunnel_pool]
min_connections = 1
max_connections = 4
interactive_lanes = 1
bulk_lanes = 2
max_reconnect_attempts = 3
max_connection_age_secs = 3600

[local.tun]
enabled = false
name = "esptun0"
address = "10.255.0.2"
prefix = 24
destination = "10.255.0.1"
mtu = 1500
udp_enabled = true
udp_timeout_secs = 3
# Drop QUIC by default so browsers fall back to TCP HTTPS instead of creating
# long-lived UDP/443 relay timeouts in global TUN mode.
udp_block_ports = [443]

[local.tun.route]
enabled = false
protect_server_route = true
dns_enabled = false
dns_servers = ["1.1.1.1", "8.8.8.8"]

[logging]
level = "info"
format = "compact"
ansi = true
# file = "/var/log/espejismo/espejismo.log"

[admin]
# Public admin listeners require token. Loopback is recommended.
# listen = "127.0.0.1:9090"
# token = "change-me-admin-token"

[remote]
listen = "0.0.0.0:6690"
handshake_timeout_ms = 3000
reject_delay_ms = 0
max_handshake_padding = 1024
replay_window_secs = 60
cold_start_delay_ms = 35
tarpit_max = 1024
tarpit_hold_secs = 300

[remote.fallback_http]
mode = "silent"
# mode = "http_fallback"
# enabled = true # legacy switch, kept for backward compatibility
upstream = "127.0.0.1:8080"
probe_timeout_ms = 250
server = "nginx"
body = "<html><head><title>It works</title></head><body><h1>It works</h1></body></html>"

[[remote.users]]
name = "default"
psk = "change-me-long-random-secret"

[remote.users.quota]
# bytes = 536870912
window_secs = 86400

[remote.users.bandwidth]
# bytes_per_sec = 1048576

[remote.egress]
deny_private_ips = true
allow_hosts = []
block_hosts = []
allow_ports = [80, 443]
block_ports = []
# Optional server-side upstream proxy for egress IP switching.
# TCP supports socks://, socks4://, socks4a://, socks5://, http://, and https://.
# UDP requires socks5:// because SOCKS4 and HTTP CONNECT are TCP-only.
# proxy = "socks://127.0.0.1:1080" # alias for socks5://
# proxy = "socks4a://127.0.0.1:1080"
# proxy = "socks5://127.0.0.1:1080"
# proxy = "socks5://user:pass@127.0.0.1:1080"
# proxy = "http://user:pass@127.0.0.1:8080"
# proxy = "https://user:pass@proxy.example.com:8443"
# Legacy alias, still supported for no-auth SOCKS5:
# socks5_proxy = "127.0.0.1:1080"
