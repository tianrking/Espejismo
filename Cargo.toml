[workspace]
members = [
    "crates/espejismo-core",
    "crates/espejismo-client",
    "crates/espejismo-server",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.2"
authors = ["Espejismo contributors"]
description = "A native cross-platform Rust privacy tunnel for encrypted public-network transport experiments."

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
netstack-smoltcp = "0.2.2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-yamux = "0.3"
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tun-rs = { version = "2.8", features = ["async"] }
ureq = { version = "2.12", default-features = true, features = ["json"] }
webpki-roots = "1.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
