services:
  espejismo-remote:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    command: ["--config", "/etc/espejismo/espejismo.toml"]
    ports:
      - "8443:8443/tcp"
    volumes:
      - ../../configs/examples/espejismo.toml:/etc/espejismo/espejismo.toml:ro
    restart: unless-stopped
